<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Мои траты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#ffffff);--text:var(--tg-theme-text-color,#17202b);--mute:var(--tg-theme-hint-color,#6b7787);--panel:var(--tg-theme-secondary-bg-color,#eef1f5);--btn:var(--tg-theme-button-color,#2f80ed);--btnT:var(--tg-theme-button-text-color,#ffffff);--danger:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:14px 14px 40px}
.mo{display:flex;align-items:center;justify-content:space-between}
.mo button{border:0;background:var(--panel);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}
.mo span{font-weight:700;text-transform:capitalize}
.total{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:10px 0 0}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--panel);border-radius:16px;padding:14px;margin-top:14px}
h2{font-size:16px;margin:0 0 10px}
input{width:100%;border:2px solid transparent;background:var(--bg);color:var(--text);border-radius:12px;padding:12px;font:600 17px inherit;font-family:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.r2{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:2px solid transparent;background:var(--bg);color:var(--text);border-radius:99px;padding:7px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed=true]{color:#fff;border-color:transparent}
.add{width:100%;border:0;background:var(--btn);color:var(--btnT);border-radius:12px;padding:14px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.bk{margin:10px 0}
.bk .t{display:flex;justify-content:space-between;font-size:15px}
.bk .b{height:8px;border-radius:99px;background:var(--bg);margin-top:4px;overflow:hidden}
.bk .b i{display:block;height:100%;border-radius:99px}
.it{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bg)}
.it:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%}
.it b{font-size:16px}.it small{display:block;color:var(--mute)}
.it .del{border:0;background:transparent;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:14px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <div class="mo">
    <button id="prev" aria-label="Предыдущий месяц">‹</button>
    <span id="mlabel"></span>
    <button id="next" aria-label="Следующий месяц">›</button>
  </div>
  <p class="total" id="total">0 ₽</p>
  <p class="mute" id="count"></p>

  <section class="card" aria-label="Добавить трату">
    <h2>Новая трата</h2>
    <input id="amt" type="text" inputmode="decimal" placeholder="Сумма, ₽" autocomplete="off" aria-label="Сумма">
    <div class="chips" id="chips" role="group" aria-label="Категория"></div>
    <div class="r2">
      <input id="note" type="text" placeholder="Заметка (необязательно)" maxlength="40" aria-label="Заметка">
      <input id="date" type="date" aria-label="Дата">
    </div>
    <button class="add" id="add" style="margin-top:12px">Добавить</button>
  </section>

  <section class="card" aria-label="По категориям">
    <h2>По категориям</h2>
    <div id="bk"></div>
  </section>

  <section class="card" aria-label="Список трат">
    <h2>Траты за месяц</h2>
    <div id="list"></div>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const haptic = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(k); } catch(e){} };
const $ = id => document.getElementById(id);

const CATS = [
  {id:"food", n:"Еда",         c:"#3fa66b"},
  {id:"tr",   n:"Транспорт",   c:"#2f80ed"},
  {id:"home", n:"Дом",         c:"#9b59b6"},
  {id:"fun",  n:"Развлечения", c:"#e0872f"},
  {id:"hl",   n:"Здоровье",    c:"#e5484d"},
  {id:"oth",  n:"Другое",      c:"#7d8794"}
];
const catOf = id => CATS.find(c => c.id === id) || CATS[5];
const rub = n => new Intl.NumberFormat("ru-RU", {maximumFractionDigits: 2}).format(n) + " ₽";

let items = [];
try { items = JSON.parse(localStorage.getItem("expenses")) || []; } catch(e){}
function save(){ try { localStorage.setItem("expenses", JSON.stringify(items)); } catch(e){} }

let sel = "food";
let view = new Date(); view.setDate(1); view.setHours(0, 0, 0, 0);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
$("date").value = today();

let toastT;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }

function inView(i){ const d = new Date(i.ts); return d.getFullYear() === view.getFullYear() && d.getMonth() === view.getMonth(); }

function render(){
  $("mlabel").textContent = view.toLocaleDateString("ru-RU", {month: "long", year: "numeric"});
  const list = items.filter(inView).sort((a, b) => b.ts - a.ts);
  const total = list.reduce((s, i) => s + i.amount, 0);
  $("total").textContent = rub(total);
  $("count").textContent = list.length ? "Трат: " + list.length : "В этом месяце трат нет";

  const chips = $("chips"); chips.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c.n; b.setAttribute("aria-pressed", c.id === sel);
    if (c.id === sel) b.style.background = c.c;
    b.onclick = () => { sel = c.id; render(); };
    chips.appendChild(b);
  });

  const bk = $("bk"); bk.innerHTML = "";
  const sums = CATS.map(c => ({c, s: list.filter(i => i.cat === c.id).reduce((a, i) => a + i.amount, 0)})).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  if (!sums.length) bk.innerHTML = '<div class="empty">Появится после первой траты</div>';
  sums.forEach(x => {
    const pct = total ? x.s / total * 100 : 0, d = document.createElement("div");
    d.className = "bk";
    d.innerHTML = '<div class="t"><span></span><b></b></div><div class="b"><i></i></div>';
    d.querySelector("span").textContent = x.c.n + " · " + Math.round(pct) + "%";
    d.querySelector("b").textContent = rub(x.s);
    const bar = d.querySelector("i"); bar.style.width = pct + "%"; bar.style.background = x.c.c;
    bk.appendChild(d);
  });

  const ul = $("list"); ul.innerHTML = "";
  if (!list.length) ul.innerHTML = '<div class="empty">Пока пусто. Добавь первую трату выше.</div>';
  list.forEach(i => {
    const c = catOf(i.cat), row = document.createElement("div");
    row.className = "it";
    row.innerHTML = '<span class="dot"></span><div><b></b><small></small></div><b class="a"></b><button class="del" aria-label="Удалить">×</button>';
    row.querySelector(".dot").style.background = c.c;
    row.querySelector("div b").textContent = i.note || c.n;
    row.querySelector("small").textContent = new Date(i.ts).toLocaleDateString("ru-RU", {day: "numeric", month: "short"}) + (i.note ? " · " + c.n : "");
    row.querySelector(".a").textContent = rub(i.amount);
    row.querySelector(".del").onclick = () => {
      const go = ok => { if (ok) { items = items.filter(x => x.id !== i.id); save(); render(); toast("Удалено"); } };
      if (tg && tg.showConfirm) tg.showConfirm("Удалить трату " + rub(i.amount) + "?", go); else go(confirm("Удалить трату?"));
    };
    ul.appendChild(row);
  });
}

$("add").onclick = () => {
  const v = parseFloat($("amt").value.replace(",", ".").replace(/\s/g, ""));
  if (!(v > 0)) { haptic("error"); toast("Введи сумму больше нуля"); $("amt").focus(); return; }
  const ts = new Date(($("date").value || today()) + "T12:00:00").getTime();
  items.push({id: Date.now() + Math.random(), ts, amount: Math.round(v * 100) / 100, cat: sel, note: $("note").value.trim()});
  save();
  const d = new Date(ts); view = new Date(d.getFullYear(), d.getMonth(), 1);
  $("amt").value = ""; $("note").value = "";
  haptic("success"); toast("Добавлено"); render();
};
$("amt").addEventListener("keydown", e => { if (e.key === "Enter") $("add").click(); });
$("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
$("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
render();
</script>
</body>
</html>
